name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

  release:
    name: Release
    needs: quality
    runs-on: ubuntu-latest
    # npm trusted publishing: npmjs.com accepts a publish only from this
    # repository, workflow file and environment, using the short-lived OIDC
    # token below, so no npm token is stored here. A reviewer approves each
    # run in the environment before it can publish.
    environment: npm-publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing and provenance
    steps:
      # Releases are tag + GitHub Release only (no commit pushed back to
      # `main`), so the default GITHUB_TOKEN is sufficient and no branch
      # protection bypass is needed. semantic-release derives the next
      # version from git tags, not package.json.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Trusted publishing needs npm 11.5.1 or later, and Node 22 ships npm 10.
      # 11.11.0 is the npm version pnpm-lock.yaml already resolves for
      # @semantic-release/npm.
      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.11.0

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
