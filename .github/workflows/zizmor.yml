name: zizmor

# Audits the workflows and Dependabot config under .github with zizmor, offline,
# and fails on any high-severity finding. If a finding is acceptable, add
# `# zizmor: ignore[<rule>]` to the reported line with the reason above it.
on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Audit GitHub workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action installs the exact zizmor version below from a wheel checked
      # against pinned hashes. ZIZMOR_OFFLINE makes it the same as `--offline`.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        env:
          ZIZMOR_OFFLINE: "true"
        with:
          version: 1.31.1
          inputs: .github
          min-severity: high
          online-audits: false
          advanced-security: false
